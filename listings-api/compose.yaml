# Local stack:            docker compose up -d --build
# Only MongoDB (dev):     docker compose up -d mongo   then ./mvnw spring-boot:run
# API on a remote Mongo:  MONGODB_URI="mongodb+srv://..." docker compose up -d --build --no-deps api
services:
  mongo:
    image: mongo:7.0
    restart: unless-stopped
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    restart: unless-stopped
    ports:
      - "${API_PORT:-8080}:8080"
    environment:
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongo:27017/listings}
      API_KEY: ${API_KEY:-}
      API_KEY_PROTECT_QUERIES: ${API_KEY_PROTECT_QUERIES:-false}
      INACTIVITY_STALE_AFTER: ${INACTIVITY_STALE_AFTER:-3d}
    depends_on:
      mongo:
        condition: service_healthy
        required: false

volumes:
  mongo-data:
