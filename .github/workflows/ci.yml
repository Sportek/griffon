name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (build + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: listings-api
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # Integration tests start MongoDB with Testcontainers (Docker is available on the runner).
      - run: ./mvnw -B verify

  scraper:
    name: Scraper (tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scraper
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements*.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest -q

  images:
    name: Docker images
    runs-on: ubuntu-latest
    needs: [api, scraper]
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t griffon-api listings-api
      - run: docker build -t griffon-worker scraper
      - name: Compose files are valid
        env:
          MONGO_USER: ci
          MONGO_PASSWORD: ci
          API_KEY: ci
        run: |
          docker compose -f listings-api/compose.prod.yaml config -q
          docker compose -f listings-api/compose.dokploy.yaml config -q
          docker compose -f scraper/compose.worker.yaml --env-file scraper/.env.worker.example config -q
