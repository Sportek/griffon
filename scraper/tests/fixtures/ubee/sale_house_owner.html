de&nbsp;paix.&nbsp;Intime&nbsp;et&nbsp;sécuritaire,&nbsp;elle&nbsp;offre&nbsp;un&nbsp;accès&nbsp;direct&nbsp;au&nbsp;garage&nbsp;et&nbsp;suffisamment&nbsp;d'espace&nbsp;pour&nbsp;les&nbsp;enfants,&nbsp;les&nbsp;animaux&nbsp;de&nbsp;compagnie&nbsp;ou&nbsp;la&nbsp;réalisation&nbsp;de&nbsp;vos&nbsp;projets&nbsp;d'aménagement&nbsp;paysager.</span></p><p></p><p><span style=\"color: rgb(51, 51, 51); background-color: rgb(255, 255, 255);\">Alliant&nbsp;le&nbsp;caractère&nbsp;chaleureux&nbsp;du&nbsp;milieu&nbsp;du&nbsp;siècle&nbsp;à&nbsp;des&nbsp;améliorations&nbsp;soigneusement&nbsp;choisies&nbsp;et&nbsp;au&nbsp;confort&nbsp;moderne,&nbsp;cette&nbsp;propriété&nbsp;clé&nbsp;en&nbsp;main&nbsp;représente&nbsp;une&nbsp;occasion&nbsp;exceptionnelle&nbsp;dans&nbsp;l'un&nbsp;des&nbsp;quartiers&nbsp;les&nbsp;plus&nbsp;recherchés&nbsp;d'Aylmer.&nbsp;Sa&nbsp;proximité&nbsp;aux&nbsp;différents&nbsp;services&nbsp;ainsi&nbsp;que&nbsp;son&nbsp;secteur&nbsp;homogène&nbsp;bordé&nbsp;d'arbres&nbsp;matures&nbsp;seront&nbsp;vous&nbsp;séduire.&nbsp;</span></p><p></p><p></p>", "plainText": "Bienvenue au 44 Elgin, un magnifique bungalow d'inspiration Mid-Century Moderne situé dans le très convoité secteur Domaine-Glenwood à Aylmer. Dès votre arrivée, vous serez séduit par le charme intemporel de cette propriété soigneusement mise au goût du jour. Son extérieur fraîchement revitalisé, sa façade au style actuel, sa toiture récente ainsi que ses nouvelles portes et fenêtres contribuent à son allure modernisée tout en offrant tranquillité d'esprit aux futurs propriétaires. Le rez-de-chaussée propose une aire de vie lumineuse et conviviale où chaque espace a été pensé pour le confort au quotidien. La cuisine allie élégance et fonctionnalité grâce à ses nombreux rangements, son coin café accueillant et son vaste îlot central, véritable cur de la maison. Ouverte sur la salle à manger et le salon, elle crée un environnement parfait autant pour la vie familiale que pour recevoir famille et amis. Baigné de lumière naturelle, cet espace de vie se prolonge harmonieusement vers l'extérieur grâce à un accès direct à la cour arrière. Vous y découvrirez un patio surélevé offrant un cadre intime et agréable pour les repas d'été, les moments de détente et les réceptions en toute intimité. À l'étage, trois chambres de bonnes dimensions ainsi qu'une salle de bain complète récemment rénovée vous attendent, offrant confort et tranquillité à toute la famille. Le sous-sol propose une vaste salle familiale idéale pour les soirées cinéma, les rassemblements ou simplement pour relaxer. Vous y trouverez également une deuxième salle de bain complète avec douche ainsi qu'un généreux espace de rangement. Son aménagement polyvalent permet de répondre à une multitude de besoins : salle d'entraînement, salle de jeux, atelier ou espace créatif. À l'extérieur, la grande cour arrière entièrement clôturée constitue un véritable havre de paix. Intime et sécuritaire, elle offre un accès direct au garage et suffisamment d'espace pour les enfants, les animaux de compagnie ou la réalisation de vos projets d'aménagement paysager. Alliant le caractère chaleureux du milieu du siècle à des améliorations soigneusement choisies et au confort moderne, cette propriété clé en main représente une occasion exceptionnelle dans l'un des quartiers les plus recherchés d'Aylmer. Sa proximité aux différents services ainsi que son secteur homogène bordé d'arbres matures seront vous séduire.", "language": "Fr", "source": "Manual"}, {"id": "482b52dc-26d9-4e59-ad32-b20f4bda9739", "text": "<p><strong style=\"color: rgb(51, 51, 51); background-color: transparent;\">Welcome to 44 Elgin, a magnificent Mid-Century Modern inspired bungalow located in the highly sought-after Domaine-Glenwood neighborhood in Aylmer.</strong></p><p></p><p><span style=\"color: rgb(51, 51, 51); background-color: rgb(255, 255, 255);\">From the moment you arrive, you will be captivated by the timeless charm of this property, carefully updated to modern standards. Its freshly revitalized exterior, contemporary-style facade, recent roof, and new doors and windows contribute to its modernized appearance while providing peace of mind to future owners.</span></p><p></p><p><span style=\"color: rgb(51, 51, 51); background-color: rgb(255, 255, 255);\">The main floor offers a bright and welcoming living area where every space has been designed for everyday comfort. The kitchen combines elegance and functionality with its abundant storage, welcoming coffee nook, and vast central island, the true heart of the home. Open to the dining room and living room, it creates a perfect environment for both family living and entertaining family and friends.</span></p><p><span style=\"color: rgb(51, 51, 51); background-color: rgb(255, 255, 255);\">Bathed in natural light, this living space flows harmoniously to the outdoors through direct access to the backyard. You will discover an elevated patio offering an intimate and pleasant setting for summer meals, moments of relaxation, and entertaining in complete privacy.</span></p><p></p><p><span style=\"color: rgb(51, 51, 51); background-color: rgb(255, 255, 255);\">Upstairs, three generously sized bedrooms and a recently renovated full bathroom await you, offering comfort and peace of mind for the entire family.</span></p><p></p><p><span style=\"color: rgb(51, 51, 51); background-color: rgb(255, 255, 255);\">The basement features a spacious family room ideal for movie nights, gatherings, or simply relaxing. You will also find a second full bathroom with shower as well as generous storage space. Its versatile layout allows it to meet a multitude of needs: fitness room, game room, workshop, or creative space.</span></p><p></p><p><span style=\"color: rgb(51, 51, 51); background-color: rgb(255, 255, 255);\">Outside, the large fully fenced backyard is a true haven of peace. Intimate and secure, it offers direct access to the garage and plenty of space for children, pets, or your landscaping projects.</span></p><p></p><p><span style=\"color: rgb(51, 51, 51); background-color: rgb(255, 255, 255);\">Combining the warm character of the mid-century with carefully selected improvements and modern comfort, this turnkey property represents an exceptional opportunity in one of Aylmer's most sought-after neighborhoods. Its proximity to various services and its tree-lined, homogeneous neighborhood will surely seduce you.</span></p><p></p><p></p>", "plainText": "Welcome to 44 Elgin, a magnificent Mid-Century Modern inspired bungalow located in the highly sought-after Domaine-Glenwood neighborhood in Aylmer. From the moment you arrive, you will be captivated by the timeless charm of this property, carefully updated to modern standards. Its freshly revitalized exterior, contemporary-style facade, recent roof, and new doors and windows contribute to its modernized appearance while providing peace of mind to future owners. The main floor offers a bright and welcoming living area where every space has been designed for everyday comfort. The kitchen combines elegance and functionality with its abundant storage, welcoming coffee nook, and vast central island, the true heart of the home. Open to the dining room and living room, it creates a perfect environment for both family living and entertaining family and friends. Bathed in natural light, this living space flows harmoniously to the outdoors through direct access to the backyard. You will discover an elevated patio offering an intimate and pleasant setting for summer meals, moments of relaxation, and entertaining in complete privacy. Upstairs, three generously sized bedrooms and a recently renovated full bathroom await you, offering comfort and peace of mind for the entire family. The basement features a spacious family room ideal for movie nights, gatherings, or simply relaxing. You will also find a second full bathroom with shower as well as generous storage space. Its versatile layout allows it to meet a multitude of needs: fitness room, game room, workshop, or creative space. Outside, the large fully fenced backyard is a true haven of peace. Intimate and secure, it offers direct access to the garage and plenty of space for children, pets, or your landscaping projects. Combining the warm character of the mid-century with carefully selected improvements and modern comfort, this turnkey property represents an exceptional opportunity in one of Aylmer's most sought-after neighborhoods. Its proximity to various services and its tree-lined, homogeneous neighborhood will surely seduce you.", "language": "En", "source": "Llm"}], "lotMunicipalAssessment": 210800, "buildingMunicipalAssessment": 224800, "taxable": false, "listingType": "Seller", "inscriptionType": "Unifamiliale", "animalPermissionType": [], "basementType": ["SixPiedsOuPlus"], "bathroomFeatureType": [], "cabinetType": ["Stratifie"], "carportType": [], "convenienceType": ["AspirateurCentral", "SemiMeuble"], "drivewayType": ["Asphalte"], "energyEfficiencyType": [], "exteriorCoveringType": ["Aluminium", "Brique"], "fenestrationType": ["PVC"], "fireplaceType": [], "foundationType": [], "garageType": ["Attache"], "heatingEnergyType": [], "heatingType": ["PlinthesElectriques"], "landType": ["Cloture"], "landZoningType": ["Residential"], "particularityType": [], "poolType": [], "proximityType": ["EcolePrimaire", "EcoleSecondaire", "Garderie", "Golf", "Parc", "PisteCyclable", "TransportEnCommun", "Universite"], "reducedMobilityType": [], "roofingType": ["BardeauxDAsphalte"], "sewerSystemType": ["Municipalite"], "viewType": [], "washerDryerLocationType": ["SousSol"], "waterAccessType": [], "waterSupplyType": ["Municipalite"], "windowMechanismType": [], "images": [{"listingVersion": 0, "index": 0, "description": "Autre", "etag": "ad01c49a1436b7fd56ec7d7a0e07b9cb", "publicUrls": {"default_size": "https://res.cloudinary.com/ubee-media/image/private/t_default_size/v1793718949/a66ece80-18a5-4c29-b099-12c82aca13e0/7ee83c2a-d212-46c4
