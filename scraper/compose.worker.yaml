# Scrape worker, meant for Gremlin (home server): a residential IP is far less likely to be
# blocked than a datacenter one. It only makes outgoing calls to the API: nothing to expose.
#
# Dokploy: Compose service on this repo, compose path scraper/compose.worker.yaml,
#          variables in the Environment tab.
# By hand: cp .env.worker.example .env.worker   # then fill it in
#          docker compose -f compose.worker.yaml --env-file .env.worker up -d --build
services:
  worker:
    build: .
    restart: unless-stopped
    environment:
      LISTINGS_API_URL: ${LISTINGS_API_URL:?set LISTINGS_API_URL}
      LISTINGS_API_KEY: ${LISTINGS_API_KEY:?set LISTINGS_API_KEY}
      WORKER_NAME: ${WORKER_NAME:-gremlin}
      WORKER_SOURCES: ${WORKER_SOURCES:-}
      WORKER_POLL_SECONDS: ${WORKER_POLL_SECONDS:-60}
      GEOCODER_EMAIL: ${GEOCODER_EMAIL:-}
      SCRAPER_MIN_DELAY: ${SCRAPER_MIN_DELAY:-2.0}
      SCRAPER_MAX_DELAY: ${SCRAPER_MAX_DELAY:-5.0}
      SCRAPER_MAX_REQUESTS: ${SCRAPER_MAX_REQUESTS:-6000}
      SCRAPER_BLOCK_THRESHOLD: ${SCRAPER_BLOCK_THRESHOLD:-3}
      SCRAPER_BROWSER_MIN_DELAY: ${SCRAPER_BROWSER_MIN_DELAY:-3.0}
      SCRAPER_BROWSER_MAX_DELAY: ${SCRAPER_BROWSER_MAX_DELAY:-7.0}
      # Facebook groups source (README, "Source Facebook"). The session file lives in the
      # facebook-data volume; FACEBOOK_STORAGE_STATE_B64 can seed it from the Environment tab.
      FACEBOOK_GROUPS: ${FACEBOOK_GROUPS:-https://www.facebook.com/groups/242242325809377,https://www.facebook.com/groups/232947036803405,https://www.facebook.com/groups/logementpmr.annonces}
      FACEBOOK_STORAGE_STATE: /data/facebook/storage_state.json
      FACEBOOK_STORAGE_STATE_B64: ${FACEBOOK_STORAGE_STATE_B64:-}
      FACEBOOK_MAX_POSTS_PER_GROUP: ${FACEBOOK_MAX_POSTS_PER_GROUP:-60}
      FACEBOOK_MAX_SCROLLS: ${FACEBOOK_MAX_SCROLLS:-25}
      FACEBOOK_MAX_AGE_DAYS: ${FACEBOOK_MAX_AGE_DAYS:-14}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-google/gemini-2.5-flash-lite}
      FACEBOOK_LLM_TOKEN_BUDGET: ${FACEBOOK_LLM_TOKEN_BUDGET:-150000}
    # The API fails a run after its running-timeout without a heartbeat; give the
    # worker time to finish the current run as FAILED on shutdown.
    stop_grace_period: 30s
    volumes:
      - geo-cache:/app/.cache
      # Facebook session (storage_state.json) + seen posts / LLM cache (cache.json).
      - facebook-data:/data/facebook
    # Chromium needs a bigger /dev/shm than Docker's 64 MB default.
    shm_size: 1gb

volumes:
  geo-cache:
  facebook-data:
